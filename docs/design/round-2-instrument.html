<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gates Local, instrument (round 2)</title>
<style>
/* ------------------------------------------------------------------
   Gates Local, round 2, "instrument" variant.
   Skeleton lifted from T3 Code (MIT, Copyright 2026 T3 Tools Inc.):
   index.css tokens, ui/sidebar.tsx rows, ChatHeader, MessagesTimeline,
   ChatComposer, ProviderStatusBanner, ContextWindowMeter, kbd.
   Every colour goes through a custom property. Light and dark both ship.
   ------------------------------------------------------------------ */
:root{
  color-scheme:light;
  /* neutrals: graphite (light) */
  --bg:#fafaf9; --sidebar:#f3f3f2; --surface:#ffffff; --surface-2:#f4f4f3; --bubble:#ececea;
  --ink:#1b1c1e; --ink-2:#5c5f66; --ink-3:#6f727a;
  --line:rgb(0 0 0 / 9%); --line-strong:rgb(0 0 0 / 16%);
  --hover:rgb(0 0 0 / 4%); --active:rgb(0 0 0 / 7%); --selected:#ffffff;
  --hi:rgb(255 255 255 / 70%); --track:rgb(0 0 0 / 6%);
  --seg-1:#6f7279; --seg-2:#9fa3ab; --seg-3:#c2c5cb;
  --action:#1b1c1e; --on-action:#fafaf9;
  --ok:hsl(148 55% 34%); --warn:hsl(42 90% 38%); --err:hsl(358 68% 48%);
  --scroll:rgb(0 0 0 / 14%);
  --shadow-pop:0 16px 40px -18px rgb(0 0 0 / 35%);
  /* accent (HSL-derived in JS; these are the boot values) */
  --acc:hsl(30 90% 34%); --acc-deep:hsl(30 80% 26%); --acc-soft:hsl(30 40% 94%); --acc-ring:hsl(30 50% 78%); --on-acc:#fff;
  /* derived semantic surfaces */
  --ok-soft:color-mix(in srgb, var(--ok) 13%, transparent);
  --warn-soft:color-mix(in srgb, var(--warn) 13%, transparent);
  --err-soft:color-mix(in srgb, var(--err) 12%, transparent);

  /* type */
  --sans:"Adwaita Sans", system-ui, sans-serif;
  --mono:"JetBrainsMono Nerd Font", "JetBrains Mono", "DejaVu Sans Mono", monospace;
  --num:var(--mono); --num-scale:.92;

  /* radius scale, from one base (T3: --radius .625rem, --control-radius .5rem) */
  --r:4px;
  --r-sm:max(1px, calc(var(--r) - 2px));
  --r-lg:calc(var(--r) * 2);
  --r-bubble:min(calc(var(--r) * 3), 16px);
  --r-comp:min(calc(var(--r) * 2 + 4px), 20px);

  /* density (Linear-plus default) */
  --side-w:248px; --top-h:44px; --row-h:28px; --fs-ui:13px; --fs-msg:15px; --lh-msg:1.62;
  --turn-gap:22px; --col:880px; --prose:820px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121314; --sidebar:#0e0f10; --surface:#17181a; --surface-2:#1c1d20; --bubble:#202124;
    --ink:#e7e7e9; --ink-2:#9c9ea5; --ink-3:#7b7e86;
    --line:rgb(255 255 255 / 7.5%); --line-strong:rgb(255 255 255 / 13%);
    --hover:rgb(255 255 255 / 4%); --active:rgb(255 255 255 / 7%); --selected:rgb(255 255 255 / 6%);
    --hi:rgb(255 255 255 / 4%); --track:rgb(255 255 255 / 6.5%);
    --seg-1:#7d8089; --seg-2:#50535a; --seg-3:#393b40;
    --action:#e7e7e9; --on-action:#121314;
    --ok:hsl(146 48% 52%); --warn:hsl(46 88% 58%); --err:hsl(358 75% 64%);
    --scroll:rgb(255 255 255 / 9%);
    --shadow-pop:0 18px 44px -18px rgb(0 0 0 / 80%);
    --acc:hsl(32 92% 60%); --acc-deep:hsl(32 94% 74%); --acc-soft:hsl(32 34% 11%); --acc-ring:hsl(32 26% 23%); --on-acc:hsl(32 40% 8%);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121314; --sidebar:#0e0f10; --surface:#17181a; --surface-2:#1c1d20; --bubble:#202124;
  --ink:#e7e7e9; --ink-2:#9c9ea5; --ink-3:#7b7e86;
  --line:rgb(255 255 255 / 7.5%); --line-strong:rgb(255 255 255 / 13%);
  --hover:rgb(255 255 255 / 4%); --active:rgb(255 255 255 / 7%); --selected:rgb(255 255 255 / 6%);
  --hi:rgb(255 255 255 / 4%); --track:rgb(255 255 255 / 6.5%);
  --seg-1:#7d8089; --seg-2:#50535a; --seg-3:#393b40;
  --action:#e7e7e9; --on-action:#121314;
  --ok:hsl(146 48% 52%); --warn:hsl(46 88% 58%); --err:hsl(358 75% 64%);
  --scroll:rgb(255 255 255 / 9%);
  --shadow-pop:0 18px 44px -18px rgb(0 0 0 / 80%);
  --acc:hsl(32 92% 60%); --acc-deep:hsl(32 94% 74%); --acc-soft:hsl(32 34% 11%); --acc-ring:hsl(32 26% 23%); --on-acc:hsl(32 40% 8%);
}

/* density variants */
:root[data-density="t3"]{ --side-w:256px; --top-h:52px; --row-h:32px; --fs-ui:14px; --fs-msg:14px; --lh-msg:1.65; --turn-gap:20px; --col:768px; --prose:768px; }
:root[data-density="compact"]{ --side-w:232px; --top-h:40px; --row-h:26px; --fs-ui:12.5px; --fs-msg:15px; --lh-msg:1.55; --turn-gap:16px; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);font-size:var(--fs-ui);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc-ring);outline-offset:1px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:calc(1em * var(--num-scale));letter-spacing:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.s12{width:12px;height:12px}.ic.s14{width:14px;height:14px}
/* thin scrollbars (T3 index.css: 6px, transparent track) */
*{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:3px}

/* surface treatments */
.sf{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line), inset 0 1px 0 var(--hi)}
:root[data-surface="filled"] .sf{background:var(--surface-2);box-shadow:0 1px 2px rgb(0 0 0 / 10%), 0 10px 28px -18px rgb(0 0 0 / 55%)}
.pop.sf, :root[data-surface="filled"] .pop.sf{box-shadow:inset 0 0 0 1px var(--line-strong), inset 0 1px 0 var(--hi), var(--shadow-pop)}
:root[data-surface="filled"] .pop.sf{background:var(--surface-2);box-shadow:inset 0 1px 0 var(--hi), var(--shadow-pop)}

/* kbd (T3 ui/kbd.tsx: h-5 min-w-5 rounded bg-muted px-1 text-xs) */
.kbd{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding:0 4px;border-radius:var(--r-sm);font-family:var(--mono);font-size:10.5px;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line);background:transparent;line-height:1}
.kbds{display:inline-flex;gap:3px;margin-left:auto}

/* ============ app shell ============ */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh}
.side{background:var(--sidebar);box-shadow:inset -1px 0 0 var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{height:var(--top-h);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.wordmark{font-weight:600;font-size:13px;letter-spacing:-.005em}
.wordmark span{color:var(--ink-3);font-weight:500}
.side-actions{padding:2px 8px 6px;display:flex;flex-direction:column;gap:1px}
.srow{height:var(--row-h);display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:var(--r);color:var(--ink-2);width:100%;text-align:left}
.srow:hover{background:var(--hover);color:var(--ink)}
.srow .ic{color:var(--ink-3)}
.srow:hover .ic{color:var(--ink-2)}
.side-scroll{flex:1;overflow-y:auto;padding:4px 8px 12px;min-height:0}
.glabel{font-size:11px;font-weight:500;color:var(--ink-3);padding:12px 10px 4px;letter-spacing:.01em}
.trow{height:var(--row-h);display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:var(--r);width:100%;text-align:left;color:var(--ink-2)}
.trow:hover{background:var(--hover);color:var(--ink)}
.trow.on{background:var(--selected);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
:root[data-theme="dark"] .trow.on{box-shadow:none}
.trow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .ago{color:var(--ink-3);font-size:11px}
.trow .live{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0;animation:pulse 1.6s steps(6) infinite}
.side-foot{padding:8px;box-shadow:inset 0 1px 0 var(--line);display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.rt{display:flex;align-items:center;gap:8px;padding:0 10px;height:var(--row-h);color:var(--ink-2);font-size:12px;border-radius:var(--r);width:100%;text-align:left}
.rt:hover{background:var(--hover)}
.rt .v{margin-left:auto;color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--ink-3)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.acc{background:var(--acc)}
.dot.spin{background:none;width:10px;height:10px;border:1.5px solid var(--line-strong);border-top-color:var(--acc);animation:spin .8s linear infinite}
.gpum{display:block;padding:6px 10px 8px;border-radius:var(--r);width:100%;text-align:left}
.gpum:hover{background:var(--hover)}
.gpum .hd{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--ink-2);margin-bottom:6px}
.gpum .hd .num{margin-left:auto;color:var(--ink)}
.gpum .hd .num i{font-style:normal;color:var(--ink-3)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.hdr{height:var(--top-h);flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px 0 20px;box-shadow:inset 0 -1px 0 var(--line)}
.hdr .crumb{color:var(--ink-3);font-size:var(--fs-ui)}
.hdr .sep{color:var(--ink-3);opacity:.6}
.hdr h2{margin:0;font-size:var(--fs-ui);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:6px}
.hdr h2 .pen{opacity:0;color:var(--ink-3);transition:opacity .12s}
.hdr h2:hover .pen{opacity:1}
.hdr .grow{flex:1}
.ibtn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--ink-3)}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.banner-slot{flex-shrink:0;display:flex;justify-content:center}
.tl{flex:1;overflow-y:auto;min-height:0;scrollbar-gutter:stable}
.col{max-width:var(--col);margin:0 auto;padding:28px 28px 28px}
.turns{display:flex;flex-direction:column;gap:var(--turn-gap);padding-bottom:20px}

/* user bubble (T3: max-w-[80%] rounded-2xl bg-message p-3) */
.u{display:flex;flex-direction:column;align-items:flex-end;position:relative}
.u .acts,.a .acts{position:absolute;top:100%;padding-top:2px}
.u .acts{right:0}.a .acts{left:0}
.a{position:relative}
/* steps inside one reply sit closer than separate turns */
.think + .step,.step + .step,.step + .a,.think + .a,.step + .status,.think + .status,.a + .status{margin-top:calc(8px - var(--turn-gap))}
.think + .step{margin-top:calc(4px - var(--turn-gap))}
.u .b{max-width:78%;background:var(--bubble);border-radius:var(--r-bubble);padding:10px 14px;font-size:var(--fs-msg);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);opacity:0;transition:opacity .15s;min-height:24px}
.u:hover .acts,.u:focus-within .acts,.a:hover .acts,.a:focus-within .acts{opacity:1}
.acts .cbtn{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--ink-3)}
.acts .cbtn:hover{background:var(--hover);color:var(--ink)}
.acts .m{display:inline-flex;gap:6px;align-items:center}
.acts .m b{font-weight:500;color:var(--ink-2)}
.acts .m .d{opacity:.5}

/* assistant block: plain, book width */
.a{display:flex;flex-direction:column;gap:2px;max-width:var(--prose)}
.md{font-size:var(--fs-msg);line-height:var(--lh-msg);padding:0 4px}
.md p{margin:0 0 .7em}.md p:last-child{margin-bottom:0}
.md ol,.md ul{margin:.2em 0 .8em;padding-left:1.4em}.md li{margin:.15em 0}.md li::marker{color:var(--ink-3);font-family:var(--num);font-size:.9em}
.md code{font-family:var(--mono);font-size:.86em;padding:1px 5px;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line);background:var(--hover)}
.md strong{font-weight:600}
.md em{font-style:italic}
.md table{border-collapse:collapse;margin:.4em 0 .9em;font-size:13.5px;width:100%}
.md th{font-weight:500;color:var(--ink-3);font-size:12px;text-align:left;padding:6px 12px 6px 0;box-shadow:inset 0 -1px 0 var(--line-strong)}
.md td{padding:7px 12px 7px 0;box-shadow:inset 0 -1px 0 var(--line)}
.md td.n,.md th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.md td.n{font-size:calc(13.5px * var(--num-scale))}
.md .stopped{color:var(--ink-3);font-size:12px;font-style:normal}

/* thinking line */
.think{font-size:12.5px;color:var(--ink-3);padding:0 4px}
.think .tg{display:inline-flex;align-items:center;gap:6px;height:24px;border-radius:var(--r);padding:0 4px 0 2px;margin-left:-2px}
.think .tg:hover{color:var(--ink)}
.think .tg .ic{transition:transform .15s}
.think.open .tg .ic{transform:rotate(90deg)}
.think .body{display:none;margin:4px 0 2px 9px;padding:2px 0 2px 14px;box-shadow:inset 1px 0 0 var(--line-strong);font-size:13.5px;line-height:1.55;color:var(--ink-2);max-width:var(--prose)}
.think.open .body{display:block}
.think.live .lbl{animation:breathe 1.4s steps(5) infinite}

/* tool step rows */
.step{padding:0 4px;min-width:0}
.step .row{display:flex;align-items:center;gap:8px;width:100%;min-width:0;text-align:left;border-radius:var(--r);height:28px;padding:0 6px;margin-left:-6px;width:calc(100% + 12px)}
.step .row:hover{background:var(--hover)}
.step .chev{color:var(--ink-3);transition:transform .15s}
.step.open .chev{transform:rotate(90deg)}
.step .mk{font-family:var(--mono);font-size:11px;width:12px;text-align:center;flex-shrink:0}
.mk.ok{color:var(--ok)}.mk.run{color:var(--acc)}.mk.err{color:var(--err)}.mk.wait{color:var(--acc)}
.step .tool{font-family:var(--mono);font-size:12px;color:var(--ink-2);flex-shrink:0}
.step .cmd{font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.step .cmd .pr{color:var(--ink-3);margin-right:6px}
.step .st{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink-3);flex-shrink:0;white-space:nowrap}
.step .out{display:none;margin:4px 0 4px 26px;border-radius:var(--r);overflow:hidden}
.step.open .out{display:block}
.step .out pre{margin:0;padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.step .out .oc{color:var(--ink-3)}
.step .out .of{display:flex;justify-content:space-between;padding:6px 12px;font-size:11px;color:var(--ink-3);box-shadow:inset 0 1px 0 var(--line);font-family:var(--num);font-variant-numeric:tabular-nums}
.step.super .row{opacity:.55}
/* T3 work-log variant (MessagesTimeline work entry: text-[12px] leading-5, size-5 icon slot) */
:root[data-step="worklog"] .step .row{height:24px;gap:6px;font-size:12px}
:root[data-step="worklog"] .step .mk{display:none}
:root[data-step="worklog"] .step .wl-ic{display:inline-flex}
:root[data-step="worklog"] .step .tool{font-family:var(--sans);font-weight:500;color:var(--ink);font-size:12px}
:root[data-step="worklog"] .step .cmd{font-family:var(--sans);color:var(--ink-3);font-size:12px}
:root[data-step="worklog"] .step .cmd .pr{display:none}
:root[data-step="worklog"] .step .out{margin-left:24px;background:var(--hover);box-shadow:none}
:root[data-step="worklog"] .step .out pre{font-size:11.5px;padding:8px}
.step .wl-ic{display:none;width:20px;height:20px;align-items:center;justify-content:center;color:var(--ink-3);flex-shrink:0}

/* status line (single indicator while streaming) */
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);padding:2px 4px;height:22px}
.status .ph{color:var(--ink-2)}
.status .num{color:var(--ink-3)}

/* empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px 10vh;overflow-y:auto}
.empty .inner{width:100%;max-width:var(--col)}
.empty h1{font-size:22px;font-weight:500;letter-spacing:-.01em;margin:0 0 20px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.card{border-radius:var(--r-lg);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:64px}
.card:hover{box-shadow:inset 0 0 0 1px var(--line-strong), inset 0 1px 0 var(--hi)}
:root[data-surface="filled"] .card:hover{background:var(--active)}
.card .ct{font-size:14px;color:var(--ink)}
.card .cs{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

/* composer (T3 ChatComposer: rounded-[22px] frame, card surface, 8% outline) */
.cwrap{padding:0 28px 16px;flex-shrink:0}
.empty .cwrap{padding:0}
.comp{max-width:var(--col);margin:0 auto;border-radius:var(--r-comp);transition:box-shadow .15s}
.comp:focus-within{box-shadow:inset 0 0 0 1px var(--line-strong), inset 0 1px 0 var(--hi)}
:root[data-surface="filled"] .comp:focus-within{box-shadow:0 1px 2px rgb(0 0 0 / 10%), 0 10px 28px -18px rgb(0 0 0 / 55%), inset 0 0 0 1px var(--line)}
.pending{border-radius:var(--r-comp) var(--r-comp) 0 0;box-shadow:inset 0 -1px 0 var(--line);padding:14px 16px 12px}
.pending .ph1{display:flex;align-items:center;gap:8px;font-size:12.5px}
.pending .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.pending .ph1 .what{font-weight:500}
.pending .ph1 .cnt{margin-left:auto;color:var(--ink-3)}
.diff{margin-top:10px;border-radius:var(--r);overflow:hidden}
.diff .fh{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:6px 10px;box-shadow:inset 0 -1px 0 var(--line)}
.diff .ln{display:flex;font-family:var(--mono);font-size:12px;line-height:20px;white-space:pre}
.diff .ln .g{width:34px;text-align:right;padding-right:8px;color:var(--ink-3);flex-shrink:0;user-select:none}
.diff .ln .s{width:16px;flex-shrink:0;color:var(--ink-3)}
.diff .ln.add{background:var(--ok-soft)}.diff .ln.add .s{color:var(--ok)}
.diff .ln.del{background:var(--err-soft)}.diff .ln.del .s{color:var(--err)}
.diff .ln .x{padding-right:10px;overflow:hidden;text-overflow:ellipsis}
.pacts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn{height:28px;padding:0 10px;border-radius:var(--r);display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink)}
.btn.outline{box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn.outline:hover{background:var(--hover)}
.btn.primary{background:var(--action);color:var(--on-action)}
.btn.primary:hover{opacity:.9}
.btn .kbd{color:inherit;opacity:.65;box-shadow:inset 0 0 0 1px currentColor;height:16px;font-size:10px}
.ta{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;padding:14px 16px 4px;font-size:var(--fs-msg);line-height:1.5;min-height:52px;max-height:220px;color:var(--ink)}
.ta::placeholder{color:var(--ink-3)}
.cfoot{display:flex;align-items:center;gap:2px;padding:6px 8px 8px 8px;min-width:0}
.cfoot .spacer{flex:1}
.cc{height:28px;padding:0 9px;border-radius:var(--r);display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12.5px;white-space:nowrap;flex-shrink:0}
.cc:hover,.cc[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
.cc .ic{color:var(--ink-3)}
.cc .sq{width:6px;height:6px;border-radius:1px;box-shadow:inset 0 0 0 1px var(--ink-3)}
.cc[aria-pressed="true"]{color:var(--ink)}
.cc[aria-pressed="true"] .sq{background:var(--acc);box-shadow:none}

.fitc.warn .vd{color:var(--warn)}.fitc.err .vd{color:var(--err)}
.ctxm{height:28px;padding:0 8px;border-radius:var(--r);display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:12px}
.ctxm:hover,.ctxm[aria-expanded="true"]{background:var(--hover);color:var(--ink)}
.mini{position:relative;width:46px;height:4px;border-radius:1px;background:var(--track);overflow:hidden;display:flex;gap:1px}
.mini i{display:block;height:100%}
.send{width:32px;height:32px;border-radius:50%;background:var(--action);color:var(--on-action);display:inline-flex;align-items:center;justify-content:center;margin-left:6px;flex-shrink:0;transition:opacity .15s, transform .12s}

.hpill{height:28px;padding:0 10px;border-radius:var(--r);display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.hpill:hover,.hpill[aria-expanded="true"]{background:var(--hover);color:var(--ink)}

/* banner (T3 ProviderStatusBanner: mx-auto w-fit pt-3, rounded-xl border py-3 ps-3.5 pe-10 text-sm) */
.banner{margin-top:12px;max-width:min(640px, calc(100% - 32px));position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 40px 12px 14px;border-radius:var(--r-lg);font-size:13px}
.banner.warn{box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--warn) 34%, transparent);background:color-mix(in srgb, var(--surface) 94%, var(--warn))}
.banner.err{box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--err) 34%, transparent);background:color-mix(in srgb, var(--surface) 94%, var(--err))}
.banner.info{box-shadow:inset 0 0 0 1px var(--line-strong), inset 0 1px 0 var(--hi);background:var(--surface)}
.banner .bi{margin-top:1px}
.banner.warn .bi{color:var(--warn)}.banner.err .bi{color:var(--err)}.banner.info .bi{color:var(--acc)}
.banner .bt{font-weight:500}
.banner .bm{color:var(--ink-2);margin-top:3px;line-height:1.45}
.banner .bx{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3)}
.banner .bx:hover{background:var(--hover);color:var(--ink)}
.banner .bb{display:flex;gap:8px;margin-top:10px}
.prog{margin-top:9px;display:flex;align-items:center;gap:10px}
.prog .tr{flex:1;height:4px;border-radius:1px;background:var(--track);overflow:hidden;min-width:220px}
.prog .tr i{display:block;height:100%;background:var(--acc);transition:width .3s linear}
.prog .num{color:var(--ink-2);font-size:12px;white-space:nowrap}

/* popovers */
.pop{position:fixed;z-index:50;display:none;border-radius:var(--r-lg);color:var(--ink);font-size:12.5px}
.pop.open{display:block}
.pop .ph{display:flex;align-items:baseline;gap:8px;padding:12px 14px 0}
.pop .ph .t{font-weight:500;font-size:12.5px}
.pop .ph .s{color:var(--ink-3);font-size:12px}
.pop .ph .r{margin-left:auto;color:var(--ink-2);font-size:12px}
.pop .hr{height:1px;background:var(--line);margin:10px 0}
.lbl3{font-size:11px;color:var(--ink-3);font-weight:500;padding:0 14px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.q{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-strong);font-size:9.5px;color:var(--ink-3);cursor:help;font-weight:600}
/* precise bar */
.pbar{padding:0 14px}
.pbar .bar{display:flex;height:6px;gap:1px;border-radius:1px;overflow:hidden;background:var(--track)}
.pbar .bar i{display:block;height:100%;min-width:1px}
.pbar .ticks{position:relative;height:16px;margin-top:3px}
.pbar .ticks span{position:absolute;top:0;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:10px;color:var(--ink-3);transform:translateX(-50%);padding-top:6px;white-space:nowrap}
.pbar .ticks span::before{content:"";position:absolute;left:50%;top:0;width:1px;height:4px;background:var(--line-strong)}
.pbar .ticks span.first{transform:none}.pbar .ticks span.first::before{left:0}
.pbar .ticks span.last{transform:translateX(-100%)}.pbar .ticks span.last::before{left:auto;right:0}
.pbar .ticks span.win{color:var(--acc)}.pbar .ticks span.win::before{background:var(--acc);height:5px}
.pbar .wrap{position:relative}
.pbar .wl{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--acc)}
.legend{padding:4px 14px 0;display:grid;grid-template-columns:10px 1fr auto auto;column-gap:10px;row-gap:0;align-items:center}
.legend > *{height:26px;display:flex;align-items:center}
.legend .chip{width:8px;height:8px;border-radius:1px}
.legend .chip.free{box-shadow:inset 0 0 0 1px var(--line-strong)}
.legend .nm{min-width:0;gap:6px;color:var(--ink-2);white-space:nowrap}
.legend .nm b{font-weight:500;color:var(--ink)}
.legend .nm .tg2{font-size:10.5px;color:var(--ink-3)}
.legend .v{justify-content:flex-end;color:var(--ink)}
.legend .v2{justify-content:flex-end;color:var(--ink-3);min-width:62px}
.legend .lsep{grid-column:1 / -1;height:1px;background:var(--line);margin:3px 0}
.legend .tot.nm{color:var(--ink-3)}
.vline{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12.5px}
.vline .vd{font-weight:500}
.vline .vd.ok{color:var(--ok)}.vline .vd.warn{color:var(--warn)}.vline .vd.err{color:var(--err)}
.vline .num{margin-left:auto;color:var(--ink-2)}
.spill{padding:0 14px;display:grid;grid-template-columns:1fr auto;row-gap:6px;column-gap:10px;align-items:center}
.spill .k{color:var(--ink-2)}
.spill .num{text-align:right;color:var(--ink)}
.spill .sb{grid-column:1 / -1;height:4px;background:var(--track);border-radius:1px;overflow:hidden}
.spill .sb i{display:block;height:100%;background:var(--warn)}
.ctxsel{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:0 14px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line-strong);overflow:hidden}
.ctxsel button{padding:7px 10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
.ctxsel button + button{box-shadow:inset 1px 0 0 var(--line-strong)}
.ctxsel button:hover{background:var(--hover)}
.ctxsel button .w{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:500}
.ctxsel button .vv{font-size:11px;color:var(--ink-3);white-space:nowrap}

/* model picker (T3 ModelPickerContent: max-w-90, search with border-b, rows px-2 py-2 text-xs) */

.pick .pf{display:flex;align-items:center;gap:8px;padding:8px 12px;box-shadow:inset 0 1px 0 var(--line);font-size:11.5px;color:var(--ink-3)}
.seg3{display:inline-flex;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line-strong);overflow:hidden}
.seg3 button{height:22px;padding:0 9px;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink-2)}
.seg3 button + button{box-shadow:inset 1px 0 0 var(--line-strong)}
.seg3 button:hover{background:var(--hover);color:var(--ink)}
.seg3 button.on{color:var(--ink);background:var(--acc-soft);box-shadow:inset 0 -2px 0 var(--acc)}
.seg3 button.on + button{box-shadow:inset 1px 0 0 var(--line-strong)}

/* command palette */
.pal-scrim{position:fixed;inset:0;z-index:60;display:none;background:rgb(0 0 0 / 28%)}
.pal-scrim.open{display:block}
.pal{position:fixed;z-index:61;left:50%;top:14vh;transform:translateX(-50%);width:min(560px, calc(100vw - 32px));border-radius:var(--r-lg);display:none}
.pal.open{display:block}
.pal input{width:100%;border:0;outline:0;background:transparent;padding:14px 16px;font-size:14px;box-shadow:inset 0 -1px 0 var(--line)}
.pal .pl{max-height:340px;overflow-y:auto;padding:6px}
.pal .pg{font-size:11px;color:var(--ink-3);padding:8px 10px 4px;font-weight:500}
.pal .pi{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:var(--r);text-align:left;color:var(--ink-2)}

.pal .pi .ic{color:var(--ink-3)}
.pal .pf{display:flex;gap:14px;padding:8px 14px;font-size:11px;color:var(--ink-3);box-shadow:inset 0 1px 0 var(--line)}
.pal .pf span{display:inline-flex;gap:5px;align-items:center}

/* tooltip */
.tip{position:fixed;z-index:80;max-width:300px;padding:8px 10px;border-radius:var(--r);font-size:13px;line-height:1.45;color:var(--ink);pointer-events:none;display:none}
.tip.open{display:block}
.tip b{font-weight:600}
.tip ul{margin:4px 0 0;padding-left:16px}
.toast{position:fixed;z-index:81;padding:4px 8px;border-radius:var(--r);font-size:12px;pointer-events:none}

/* ============ design drawer (harness chrome, not product) ============ */
.dz{position:fixed;right:14px;bottom:14px;z-index:70;width:32px;height:32px;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.dz:hover{color:var(--ink)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:356px;z-index:72;transform:translateX(100%);transition:transform .2s ease;overflow-y:auto;border-radius:0;padding:0 0 24px}
.drawer.open{transform:none}
.dscrim{position:fixed;inset:0;z-index:71;display:none}
.dscrim.open{display:block}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;background:inherit;box-shadow:inset 0 -1px 0 var(--line);z-index:1}
.dh b{font-weight:600;font-size:13px}
.dh span{font-size:11px;color:var(--ink-3)}
.fld{padding:12px 16px 0}
.fl{font-size:11px;font-weight:500;color:var(--ink-3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dsec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:18px 16px 0;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg.g2{display:grid;grid-template-columns:repeat(2,1fr)}
.seg.g3{display:grid;grid-template-columns:repeat(3,1fr)}
.seg.g4{display:grid;grid-template-columns:repeat(4,1fr)}
.seg button{font-size:12px;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--ink-2);padding:5px 8px;border-radius:var(--r);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg);box-shadow:none;font-weight:500}
.sw{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.sw button{height:32px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line-strong);display:flex;align-items:center;padding:0 8px;font-size:11.5px;gap:8px;overflow:hidden;white-space:nowrap;color:var(--ink-2)}
.sw button:hover{background:var(--hover);color:var(--ink)}
.sw button .pv{display:flex;gap:2px;flex-shrink:0}
.sw button .pv i{width:10px;height:10px;border-radius:1px;box-shadow:inset 0 0 0 1px var(--line-strong)}
.sw button.on{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.slider{display:grid;grid-template-columns:18px 1fr 36px;gap:8px;align-items:center;font-size:11px;color:var(--ink-3);margin-top:4px}
.slider input{width:100%;accent-color:var(--acc)}
.slider .v{text-align:right;font-family:var(--mono);color:var(--ink-2)}
.readout{margin-top:8px;display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;font-size:11.5px;align-items:center}
.readout .r{font-family:var(--mono);color:var(--ink-2);text-align:right}
.readout .gr{font-size:10px;padding:1px 5px;border-radius:var(--r-sm);font-weight:600}
.gr.pass{color:var(--ok);background:var(--ok-soft)}.gr.warn{color:var(--warn);background:var(--warn-soft)}.gr.fail{color:var(--err);background:var(--err-soft)}
.dbtn{margin-top:10px;width:100%;height:30px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line-strong);font-size:12px;color:var(--ink-2)}
.dbtn:hover{background:var(--hover);color:var(--ink)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes fadein{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.fade{animation:fadein .18s ease-out}

@media (max-width: 860px){ .app{grid-template-columns:1fr} .side{display:none} }

    var set = p[m]; if (set) Object.keys(set).forEach(function (kk) { S.setProperty(kk, set[kk]); });
  }
  function applyAccent() {
    var m = eff(), a = accent[m], S = root.style;
    S.setProperty("--acc", hsl(a.h, a.s, a.l));
    if (m === "dark") { S.setProperty("--acc-deep", hsl(a.h, a.s + 2, Math.min(a.l + 14, 78))); S.setProperty("--acc-soft", hsl(a.h, Math.min(a.s, 34), 12)); S.setProperty("--acc-ring", hsl(a.h, Math.min(a.s, 40), 30)); }
    else { S.setProperty("--acc-deep", hsl(a.h, Math.min(a.s + 4, 80), Math.max(a.l - 8, 12))); S.setProperty("--acc-soft", hsl(a.h, Math.min(a.s, 40), 94)); S.setProperty("--acc-ring", hsl(a.h, Math.min(a.s, 50), 78)); }
    var rgb = hslToRgb(a.h, a.s, a.l), dk = hslToRgb(a.h, 40, 8);
    S.setProperty("--on-acc", contrast([255, 255, 255], rgb) >= contrast(dk, rgb) ? "#fff" : hsl(a.h, 40, 8));
    updateReadout();
  }
  function applyTheme() { root.setAttribute("data-theme", state.theme); applyPalette(); applyAccent(); }
  var FONTS = {
    sans: { adwaita: '"Adwaita Sans", system-ui, sans-serif', t3: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif', fira: '"Fira Sans", system-ui, sans-serif', open: '"Open Sans", system-ui, sans-serif' },
    mono: { jetbrains: '"JetBrainsMono Nerd Font", "JetBrains Mono", "DejaVu Sans Mono", monospace', adwaita: '"Adwaita Mono", "DejaVu Sans Mono", monospace', t3: 'ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace', dejavu: '"DejaVu Sans Mono", monospace' }
  };
  function applySetting(kk) {
    var S = root.style;
    if (kk === "theme") { applyTheme(); buildDrawer(); }
    else if (kk === "palette") { accent = JSON.parse(JSON.stringify(PALETTES[state.palette].accent)); applyPalette(); applyAccent(); buildDrawer(); }
    else if (kk === "sans") S.setProperty("--sans", FONTS.sans[state.sans]);
    else if (kk === "mono") S.setProperty("--mono", FONTS.mono[state.mono]);
    else if (kk === "numFace") { S.setProperty("--num", state.numFace === "mono" ? "var(--mono)" : "var(--sans)"); S.setProperty("--num-scale", state.numFace === "mono" ? ".92" : "1"); }
    else if (kk === "radius") S.setProperty("--r", state.radius + "px");
    else if (kk === "density") root.setAttribute("data-density", state.density);
    else if (kk === "surface") root.setAttribute("data-surface", state.surface);
    else if (kk === "step") root.setAttribute("data-step", state.step);
    else if (kk === "gpuWhere") { closePops(); refreshChrome(); }
    else if (kk === "view") setView(state.view);
    else if (kk === "runtime") { bannerDismissed = null; if (state.view !== "banner" && state.runtime !== "ready" && state.runtime !== "starting") { state.view = "banner"; render(); } renderBanner(); renderFoot(); syncViewSeg(); if (state.runtime === "installing") startInstall(); }
    if (openPop) reopen();
  }
  var VIEWS = [["thread", "Thread"], ["streaming", "Streaming"], ["new", "New thread"], ["picker", "Model picker"], ["fit", "GPU fit"], ["banner", "Runtime banner"], ["memory", "Memory diff"]];
  var SETTINGS = [
    { sec: "Look" },
    { k: "theme", label: "Theme", cls: "g2", opts: [["dark", "Dark"], ["light", "Light"]] },
    { custom: "palette" },
    { k: "numFace", label: "Numeric face", cls: "g2", hint: "<b>Numbers</b> (GB, ms, tok/s, context use) render in this face with tabular figures. Labels stay in the sans.", opts: [["mono", "Mono tabular"], ["sans", "Sans tabular"]] },
    { k: "sans", label: "Sans face", cls: "g4", hint: "All four are installed on this machine. <b>T3 stack</b> is system-ui, which resolves to Noto Sans here.", opts: [["adwaita", "Adwaita"], ["t3", "T3 stack"], ["fira", "Fira"], ["open", "Open Sans"]] },
    { k: "mono", label: "Mono face", cls: "g4", hint: "<b>T3 stack</b> is ui-monospace first, which lands on Liberation Mono on this machine.", opts: [["jetbrains", "JetBrains"], ["adwaita", "Adwaita"], ["t3", "T3 stack"], ["dejavu", "DejaVu"]] },
    { k: "radius", label: "Radius", cls: "g3", hint: "One base; bubbles are 3× (capped at 16px), the composer 2× + 4px.", opts: [["4", "4px"], ["2", "2px"], ["8", "8px"]] },
    { k: "density", label: "Density", cls: "g3", hint: "<b>Linear-plus</b>: 44px header, 28px rows, 15px messages. <b>T3 stock</b>: 52px header, 32px rows, 14px messages, 768px column. <b>Compact</b>: 40 / 26 / 15.", opts: [["linear", "Linear-plus"], ["t3", "T3 stock"], ["compact", "Compact"]] },
    { k: "surface", label: "Surface treatment", cls: "g2", opts: [["hairline", "Hairline + inset"], ["filled", "Soft filled"]] },
    { sec: "Placement" },
    { k: "step", label: "Tool step row", cls: "g2", opts: [["term", "Terminal mono"], ["worklog", "T3 work log"]] },
    { k: "gpuWhere", label: "Where GPU fit lives", cls: "g3", opts: [["chip", "Composer chip"], ["sidebar", "Chip + sidebar"], ["header", "Header pill"]] }
  ];
  function segOpts(kk, opts) { return opts.map(function (o) { return '<button data-v="' + o[0] + '"' + (state[kk] === o[0] ? ' class="on"' : "") + ">" + o[1] + "</button>"; }).join(""); }
  function buildDrawer() {
    var h = '<div class="dh"><b>Design drawer</b><span>round 2 · instrument</span></div>';
    h += '<div class="dsec">Screen</div><div class="fld"><div class="seg g2" data-k="view" id="viewSeg">' + segOpts("view", VIEWS) + "</div></div>";
    h += '<div class="fld"><div class="fl">Runtime state ' + qmark("Example state for the sidebar status row and the banner. Not a taste switch.") + '</div><div class="seg g3" data-k="runtime" id="rtSeg">' + segOpts("runtime", [["ready", "Ready"], ["starting", "Starting"], ["installing", "Installing"], ["missing", "Missing"], ["wrong", "Wrong service"]]) + "</div></div>";
    SETTINGS.forEach(function (f) {
      if (f.sec) { h += '<div class="dsec">' + f.sec + "</div>"; return; }
      if (f.custom === "palette") {
        var m = eff();
        h += '<div class="fld"><div class="fl">Palette preset</div><div class="sw" id="palSw">' + Object.keys(PALETTES).map(function (id) {
          var p = PALETTES[id], a = p.accent[m];
          return '<button data-pal="' + id + '" class="' + (state.palette === id ? "on" : "") + '"><span class="pv"><i style="background:' + p.sw[m][0] + '"></i><i style="background:' + hsl(a.h, a.s, a.l) + ';box-shadow:none"></i></span><span style="overflow:hidden;text-overflow:ellipsis">' + p.label + "</span></button>";
        }).join("") + "</div>";
        var a2 = accent[m];
        h += '<div class="fl" style="margin-top:12px">Accent, ' + m + " theme " + qmark("Accent is HSL per theme; deep, soft, ring and on-accent text derive from it. Semantic green, amber and red never follow it.") + "</div>";
        h += '<div class="slider"><label>H</label><input type="range" min="0" max="359" id="accH" value="' + a2.h + '"><span class="v" id="accHv">' + a2.h + "</span></div>";
        h += '<div class="slider"><label>S</label><input type="range" min="0" max="100" id="accS" value="' + a2.s + '"><span class="v" id="accSv">' + a2.s + "</span></div>";
        h += '<div class="slider"><label>L</label><input type="range" min="10" max="90" id="accL" value="' + a2.l + '"><span class="v" id="accLv">' + a2.l + "</span></div>";
        h += '<div class="readout" id="readout"></div></div>';
        return;
      }
      h += '<div class="fld"><div class="fl">' + f.label + (f.hint ? " " + qmark(f.hint) : "") + '</div><div class="seg ' + (f.cls || "") + '" data-k="' + f.k + '">' + segOpts(f.k, f.opts) + "</div></div>";
    });
    h += '<div class="fld"><button class="dbtn" id="copyTok">Copy resolved tokens</button></div>';
    $("drawerBody").innerHTML = h;
    ["H", "S", "L"].forEach(function (c) {
      var el = $("acc" + c);
      el.oninput = function () { accent[eff()][c.toLowerCase()] = +el.value; $("acc" + c + "v").textContent = el.value; applyAccent(); if (openPop) reopen(); };
    });
    $("copyTok").onclick = function () {
      var keys = NEUTRAL_KEYS.concat(["--acc", "--acc-deep", "--acc-soft", "--acc-ring", "--on-acc", "--r", "--sans", "--mono", "--num"]);
      var txt = ":root[data-theme=\"" + eff() + "\"] {\n" + keys.map(function (kk) { return "  " + kk + ": " + tok(kk) + ";"; }).join("\n") + "\n}";
      try { navigator.clipboard.writeText(txt).catch(function () {}); } catch (err) { /* blocked */ }
      toastAt($("copyTok"), "Copied " + keys.length + " tokens");
    };
    updateReadout();
  }
  function updateReadout() {
    var box = $("readout"); if (!box) return;
    var acc = parseColor(tok("--acc")), on = parseColor(tok("--on-acc")), bg = parseColor(tok("--bg")), sb = parseColor(tok("--sidebar")), ink3 = parseColor(tok("--ink-3"));
    var rows = [["Text on accent", on, acc], ["Accent on page", acc, bg], ["Accent on sidebar", acc, sb], ["Faint ink on page", ink3, bg]];
    box.innerHTML = rows.map(function (r) {
      if (!r[1] || !r[2]) return "";
      var c = contrast(r[1], r[2]), g = grade(c);
      return "<span>" + r[0] + '</span><span class="r">' + c.toFixed(2) + ':1</span><span class="gr ' + g[1] + '">' + g[0] + "</span>";
    }).join("");
  }
  $("drawerBody").addEventListener("click", function (e) {
    var sw = e.target.closest("[data-pal]");
    if (sw) { state.palette = sw.getAttribute("data-pal"); applySetting("palette"); return; }
    var b = e.target.closest(".seg button"); if (!b) return;
    var kk = b.parentNode.getAttribute("data-k"), v = b.getAttribute("data-v");
    state[kk] = v;
    Array.prototype.forEach.call(b.parentNode.children, function (c) { c.classList.remove("on"); }); b.classList.add("on");
    applySetting(kk);
  });
  function syncViewSeg() {
    var vs = $("viewSeg"); if (vs) Array.prototype.forEach.call(vs.children, function (c) { c.classList.toggle("on", c.getAttribute("data-v") === state.view); });
    var rs = $("rtSeg"); if (rs) Array.prototype.forEach.call(rs.children, function (c) { c.classList.toggle("on", c.getAttribute("data-v") === state.runtime); });
  }
  function openDrawer() { $("drawer").classList.add("open"); $("dscrim").classList.add("open"); }
  function closeDrawer() { $("drawer").classList.remove("open"); $("dscrim").classList.remove("open"); }

  /* ------------------------------------------------------------ boot */
  applyTheme();
  ["sans", "mono", "numFace", "radius", "density", "surface", "step"].forEach(applySetting);
  buildDrawer();
  render();
  var qs = new URLSearchParams(location.search);
  qs.forEach(function (v, kk) { if (kk in state && kk !== "streaming") { state[kk] = isNaN(+v) || kk === "radius" ? v : +v; if (kk === "ctx") state.ctx = +v; applySetting(kk); } });
  if (qs.get("drawer")) openDrawer();
  window.__gl = { state: state, setView: setView, showPop: showPop, openPal: openPal };
})();
</script>
